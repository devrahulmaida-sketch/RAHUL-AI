name: RAHUL AI — Lint Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Syntax check all Python files
      run: |
        find . -name "*.py" | while read f; do
          python3 -m py_compile "$f" && echo "✓ $f" || echo "✗ $f"
        done
